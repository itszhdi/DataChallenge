[project]
name = "backend"
version = "0.1.0"
description = "CQA: LLM-based evaluation of contact-center dialogues"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.162.1",
    "httptools>=0.9.0",
    "httpx>=0.28.1",
    "openai>=3.46.0",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
